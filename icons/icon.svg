<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LLMusic">
  <!-- Ícone do LLMusic. O "LL" é de Liz e Lívia; as cinco linhas são a pauta.
       Cores da identidade: verde floresta, marfim de partitura e dourado envelhecido. -->
  <rect width="512" height="512" rx="112" fill="#263F35"/>
  <g stroke="#B49358" stroke-width="4" opacity="0.38">
    <line x1="40" y1="196" x2="472" y2="196"/>
    <line x1="40" y1="226" x2="472" y2="226"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="286" x2="472" y2="286"/>
    <line x1="40" y1="316" x2="472" y2="316"/>
  </g>
  <g fill="#F3EFE3">
    <rect x="140" y="140" width="40" height="212" rx="8"/>
    <rect x="140" y="312" width="116" height="40" rx="8"/>
    <rect x="286" y="140" width="40" height="212" rx="8"/>
    <rect x="286" y="312" width="116" height="40" rx="8"/>
  </g>
  <circle cx="402" cy="160" r="26" fill="#B49358"/>
</svg>
